[package]
name = "sql-semantic-protocol"
version = "0.2.0"
edition = "2021"
description = "Parser-independent semantic protocol and analyzer for SQL queries"
license = "MIT"
repository = "https://github.com/phdah/sql-semantic-protocol"
readme = "README.md"
keywords = ["sql", "semantics", "lineage", "parser", "analysis"]

[profile.dev]
debug = 2       # full DWARF info (line numbers + variable/type info)
opt-level = 0   # no optimisations → no inlining, no dead-code elision
incremental = false

[dependencies]
sqlparser = "0.58"
serde_json = "1"
