version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: orders
        columns:
          - name: id
            data_type: BIGINT
            data_tests:
              - not_null
              - unique
              - relationships:
                  arguments:
                    to: source('raw', 'orders')
                    field: id
          - name: customer_id
            data_type: BIGINT
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'customers')
                    field: id
          - name: amount
            data_type: BIGINT
          - name: status
            data_type: VARCHAR
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['paid', 'pending', 'cancelled']
          - name: created_at
            data_type: TIMESTAMP
          - name: region
            data_type: VARCHAR
      - name: customers
      - name: legacy_orders
      - name: returns
      # No model consumes either source: the relationship is the only reference.
      - name: constraint_only_orders
        columns:
          - name: id
            data_type: BIGINT
      - name: constraint_only_order_items
        columns:
          - name: id
            data_type: BIGINT
          - name: order_id
            data_type: BIGINT
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'constraint_only_orders')
                    field: id
