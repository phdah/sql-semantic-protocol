version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: orders
        columns:
          - name: id
            data_tests:
              - not_null
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['paid', 'pending', 'cancelled']
      - name: customers
      - name: legacy_orders
      - name: returns
