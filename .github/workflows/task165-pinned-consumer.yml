name: TASK-165 pinned downstream consumer (temporary qualification)
on:
  pull_request:
    paths:
      - '.github/workflows/task165-pinned-consumer.yml'
      - 'src/**'
      - 'tests/task_165_*.rs'
      - 'docs/task-165-acceptance-freeze.json'
permissions:
  contents: read
jobs:
  pinned-consumer:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout protocol PR head
        uses: actions/checkout@v4
      - name: Checkout pinned downstream sql-tdg
        uses: actions/checkout@v4
        with:
          repository: phdah/sql-tdg
          ref: 3beaf7799ab54b2440ae34c917ff7eda6c11c398
          path: .task165-consumer
      - name: Checkout fixed pre-PR protocol baseline
        uses: actions/checkout@v4
        with:
          ref: 7af4c128d5bc5785982ccdcd6bc7fed603651938
          path: .task165-baseline
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Validate independent downstream semantic suites against this PR head
        run: |
          cargo test --manifest-path .task165-consumer/Cargo.toml \
            --config "patch.crates-io.sql-semantic-protocol.path='$GITHUB_WORKSPACE'" \
            --lib --test full_query --test type_coverage
          cargo test --manifest-path .task165-consumer/Cargo.toml \
            --config "patch.crates-io.sql-semantic-protocol.path='$GITHUB_WORKSPACE'" \
            --test exactness -- --skip timezone_dependent_timestamp_filters_require_session_assumption
      - name: Check whether historical timezone test also fails at pre-PR baseline
        run: |
          set +e
          cargo test --manifest-path .task165-consumer/Cargo.toml \
            --config "patch.crates-io.sql-semantic-protocol.path='$GITHUB_WORKSPACE/.task165-baseline'" \
            --test exactness timezone_dependent_timestamp_filters_require_session_assumption > /tmp/baseline.log 2>&1
          baseline=$?
          cargo test --manifest-path .task165-consumer/Cargo.toml \
            --config "patch.crates-io.sql-semantic-protocol.path='$GITHUB_WORKSPACE'" \
            --test exactness timezone_dependent_timestamp_filters_require_session_assumption > /tmp/head.log 2>&1
          head=$?
          set -e
          echo "baseline_exit=$baseline head_exit=$head"
          grep 'reason=' /tmp/baseline.log || true
          grep 'reason=' /tmp/head.log || true
          if [ "$baseline" -ne "$head" ]; then
            echo "The PR changes the pinned consumer timezone test verdict"
            exit 1
          fi
          if [ "$baseline" -ne 0 ]; then
            grep -F 'reason=computed_expression clause=where' /tmp/baseline.log
            grep -F 'reason=computed_expression clause=where' /tmp/head.log
            echo "Pre-existing baseline failure confirmed. Not a TASK-165 regression."
          fi
