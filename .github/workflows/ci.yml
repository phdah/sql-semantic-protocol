name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust / ${{ matrix.check }}
    runs-on: ubuntu-latest
    env:
      # Keep full locally configured debuginfo, but avoid running out of
      # ephemeral runner disk during the complete Rust integration test suite.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        check:
          - fmt
          - lint
          - test
          - doc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provision version-matched native DuckDB
        if: matrix.check == 'test' || matrix.check == 'lint'
        run: bash scripts/prepare-duckdb-ci.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Run ${{ matrix.check }}
        if: matrix.check != 'test' && matrix.check != 'lint'
        run: make ${{ matrix.check }}

      - name: Run Rust test or lint with transient DuckDB bootstrap retry
        if: matrix.check == 'test' || matrix.check == 'lint'
        run: bash scripts/retry-duckdb-bootstrap.sh make ${{ matrix.check }}


  dbt-e2e:
    name: dbt Core E2E
    runs-on: ubuntu-latest
    env:
      # Keep full locally configured debuginfo, but avoid running out of
      # ephemeral runner disk during the complete Rust integration test suite.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provision version-matched native DuckDB
        run: bash scripts/prepare-duckdb-ci.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute SQLite native window oracle
        run: python -m unittest discover -s tests/native -p 'test_task_189_sqlite_native.py' -v

      - name: Install dbt Core test dependencies
        run: python -m pip install -r tests/requirements-dbt-e2e.txt

      - name: Run dbt Core end-to-end test
        run: make dbt-e2e

  no-default-features:
    name: Rust (no default features) / ${{ matrix.check }}
    runs-on: ubuntu-latest
    env:
      # Keep full locally configured debuginfo, but avoid running out of
      # ephemeral runner disk during the complete Rust integration test suite.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - test
          - doc
          - dependencies

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provision version-matched native DuckDB
        if: matrix.check == 'test' || matrix.check == 'lint'
        run: bash scripts/prepare-duckdb-ci.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check without default features
        if: matrix.check == 'lint'
        run: bash scripts/retry-duckdb-bootstrap.sh cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test without default features
        if: matrix.check == 'test'
        run: bash scripts/retry-duckdb-bootstrap.sh cargo test --no-default-features

      - name: Document without default features
        if: matrix.check == 'doc'
        run: cargo doc --no-deps --no-default-features

      - name: Assert saphyr is absent from normal dependencies
        if: matrix.check == 'dependencies'
        run: |
          cargo tree --no-default-features --edges normal > /tmp/dependencies.txt
          if grep -qE 'saphyr v' /tmp/dependencies.txt; then
            echo 'saphyr must not be included without the odcs feature'
            exit 1
          fi
